<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>企鵝妹的數學王國</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff5fb;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
body{overflow-x:hidden}
.home{width:100%;max-width:709px;margin:0 auto;background:#fff8fc}
.hero-window{width:100%;overflow:hidden;background:#f8d9ec}
.hero-window img{display:block;width:100%;height:auto}
.entrance-stage{position:relative;width:100%;overflow:hidden;line-height:0}
.entrance-art{display:block;width:100%;height:auto}
.hit{position:absolute;display:block;z-index:2;text-decoration:none;-webkit-tap-highlight-color:transparent;outline:none}
.hit:focus,.hit:active{outline:none}
.hit.math{left:2%;top:2%;width:47.5%;height:48.2%}
.hit.number{left:50.6%;top:2%;width:47.4%;height:48.2%}
.hit.zhuyin{left:2%;top:50.4%;width:47.5%;height:47.7%}
.hit.english{left:50.6%;top:50.4%;width:47.4%;height:47.7%}
.footer{margin:0;padding:18px 12px 26px;text-align:center;background:#fff5fb;color:#9b6392;font-size:14px;font-weight:800}
@media(min-width:710px){body{padding:18px 0 28px}.home{border-radius:30px;overflow:hidden;box-shadow:0 12px 40px rgba(118,72,111,.16)}}
</style>
</head>
<body>
<main class="home" aria-label="企鵝妹的數學王國">
  <div class="hero-window"><img src="kingdom-princess-hero.webp" alt="企鵝妹的數學王國"></div>
  <section class="entrance-stage" aria-label="學習入口">
    <img class="entrance-art" src="kingdom-entrances.webp" alt="中大班數學遊戲、數字描寫、注音描寫、英文字母描寫四個入口">
    <a class="hit math" href="/xuan-math-game-kindergarten/" aria-label="進入中大班數學遊戲"></a>
    <a class="hit number" href="/xuan-number-writing/" aria-label="進入數字描寫"></a>
    <span class="hit zhuyin" aria-label="注音描寫即將推出"></span>
    <span class="hit english" aria-label="英文字母描寫即將推出"></span>
  </section>
  <div class="footer">✨ 每一步探索，都是數學的小冒險！ 💗</div>
</main>
</body>
</html>
