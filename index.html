<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>企鵝妹的數學王國</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#f8d9ec 0%,#fdf2fa 100%)}
body{display:flex;justify-content:center;overflow-x:hidden;font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:#70456f}
.home{position:relative;width:min(100vw,709px);padding-bottom:28px}
.hero-window{position:relative;width:100%;height:min(112vw,790px);overflow:hidden;border-radius:0 0 34px 34px;background:#f8d9ec}
.hero-window img{display:block;width:100%;height:auto;max-width:none}
.hero-window:after{content:"";position:absolute;left:0;right:0;bottom:0;height:38px;background:linear-gradient(180deg,rgba(248,217,236,0),rgba(248,217,236,.96));pointer-events:none}
.section-title{margin:18px 16px 12px;text-align:center;font-size:18px;font-weight:900;color:#874c83}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{min-height:170px;border:3px solid rgba(255,255,255,.92);border-radius:28px;padding:18px 15px 15px;background:linear-gradient(145deg,#fff8fc,#f8e7f4);box-shadow:0 8px 20px rgba(125,76,120,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-decoration:none;color:#6d456d;transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:scale(.98)}
.card.math{background:linear-gradient(145deg,#fff4fa,#f9d9ec)}
.card.write{background:linear-gradient(145deg,#fff8fc,#f5e5fb)}
.card.zhuyin{background:linear-gradient(145deg,#fffdf4,#fff0c9)}
.card.english{background:linear-gradient(145deg,#f5fbff,#e1f0fb)}
.icon{font-size:40px;line-height:1;margin-bottom:9px}
.card h2{margin:0 0 6px;font-size:21px;line-height:1.2;color:#6f3f70}
.card p{margin:0 0 10px;font-size:13px;line-height:1.45;font-weight:700;color:#80637f}
.go,.lock{display:inline-flex;align-items:center;justify-content:center;padding:7px 14px;border-radius:999px;font-weight:900;font-size:13px}
.go{background:#ea5aa4;color:white;box-shadow:0 4px 0 #c83d82}
.lock{background:#aaa4b2;color:white}
.footer{margin:18px 16px 0;text-align:center;font-size:14px;font-weight:800;color:#a06c99}
@media(min-width:710px){body{padding:18px 0 28px}.home{border-radius:34px;overflow:hidden;box-shadow:0 12px 40px rgba(118,72,111,.18);background:#fff}.hero-window{border-radius:34px 34px 0 0}}
@media(max-width:480px){.hero-window{height:112vw}.cards{gap:10px;padding:0 12px}.card{min-height:158px;border-radius:24px;padding:15px 10px}.icon{font-size:35px}.card h2{font-size:19px}.card p{font-size:12px}.go,.lock{font-size:12px;padding:6px 12px}}
</style>
</head>
<body>
<main class="home" aria-label="企鵝妹的數學王國">
  <div class="hero-window"><img src="kingdom-princess-hero.webp" alt="企鵝妹的數學王國"></div>
  <div class="section-title">🐧 選擇你的數學冒險吧！ ✨</div>
  <section class="cards" aria-label="學習入口">
    <a class="card math" href="/xuan-math-game-kindergarten/" aria-label="進入中大班數學遊戲"><div class="icon">🌸</div><h2>中大班數學遊戲</h2><p>幼兒園中班～大班<br>15 個情境數學遊戲</p><span class="go">▶ 開始冒險</span></a>
    <a class="card write" href="/xuan-number-writing/" aria-label="進入數字描寫"><div class="icon">✏️</div><h2>數字描寫</h2><p>1～10 數字描寫練習<br>跟著小企鵝一起寫</p><span class="go">▶ 開始描寫</span></a>
    <div class="card zhuyin" aria-label="注音描寫即將推出"><div class="icon">🔤</div><h2>注音描寫</h2><p>注音符號描寫練習<br>內容準備中</p><span class="lock">🔒 即將推出</span></div>
    <div class="card english" aria-label="英文字母描寫即將推出"><div class="icon">🔠</div><h2>英文字母描寫</h2><p>A～Z 英文字母練習<br>內容準備中</p><span class="lock">🔒 即將推出</span></div>
  </section>
  <div class="footer">✨ 每一步探索，都是學習的小冒險！ 💗</div>
</main>
</body>
</html>
